schema_version: 1
registry_status: prospectively_frozen_extension_after_v1_test_unlock
registered_at: "2026-08-13T00:00:00+08:00"
experiment_id: minimind_v_bound_subspace_curve_v2

scope_and_timing:
  predecessor_experiment: minimind_v_bound_s4k_v1
  v1_locked_test_was_observed_before_this_registry: true
  permitted_confirmatory_claims:
    - simultaneous_compression_bounds_for_the_three_fixed_subspace_models
    - intrinsic_dimension_risk_description_length_certificate_tradeoff_on_training_distribution
  prohibited_claims:
    - new_blind_confirmation_on_the_already_opened_v1_test_split
    - choosing_models_hyperparameters_or_quantizers_from_v1_test_results
  old_v1_test_split_use: exploratory_only_after_all_v2_certificates_are_final
  new_blind_test_requirement: a_new_independent_unseen_dataset_or_split_must_be_locked_before_any_v2_model_result

frozen_inputs:
  base_registry: configs/experiment_registry.yaml
  frozen_manifest: configs/frozen_manifest.json
  projector_init_manifest: configs/projector_init_manifest.json
  implementation_contract: configs/implementation_contract_v2_subspace.json
  train_manifest: dataset/manifests/train_clusters.jsonl
  train_index: dataset/manifests/train_index
  raw_dataset: dataset/raw/pretrain_i2t.parquet
  existing_s4k_v1:
    reuse_policy: import_exact_frozen_checkpoint_and_quantized_symbols_without_retraining
    final_checkpoint: runs/s4k_formal_v1/final.pt
    final_checkpoint_sha256: af53b1e5e8b231a7b21683f9611dfd63087ef03411be9df91d90debf0d00ee5a
    quantized_manifest: runs/s4k_formal_v1/quantized_q11/manifest.json
    quantized_manifest_sha256: 8430ab2d073269742df13ef25d0365a8c3e171c333701b13bc9ed9901f011f09
    compressed_model_sha256_v1: 5c225f5a141351f9b4b065179f2f52a18383b734d3631040dc4db6ad9244c4e8

model_family:
  parameterization: subspace
  projector_parameter_count: 1182720
  structured_projection:
    family: RDKronQR
    seed: 137
    order: 2
    algorithm_version: pinned-sublora-c606ea6-order2-functional-v1
  trainable_parameter_names:
    - subspace_params
  candidates:
    - configuration_id: S-1K
      intrinsic_dimension: 1024
      quantization_levels: 11
      action: train_new
      output_directory: runs/v2_subspace/s1k
    - configuration_id: S-4K
      intrinsic_dimension: 4096
      quantization_levels: 11
      action: import_frozen_v1
      output_directory: runs/v2_subspace/s4k_imported
    - configuration_id: S-16K
      intrinsic_dimension: 16384
      quantization_levels: 11
      action: train_new
      output_directory: runs/v2_subspace/s16k

training:
  seed: 20260815
  sampler_seed: 20260815
  epochs: 2
  checkpoint_selection: final_epoch
  optimizer: AdamW
  learning_rate: 0.0004
  betas: [0.9, 0.999]
  epsilon: 1.0e-8
  weight_decay: 0.01
  scheduler: minimind_get_lr_pinned_commit
  per_gpu_batch_size: 16
  planned_world_size: 2
  global_batch_size: 32
  gradient_accumulation_steps: 1
  gradient_clip_norm: 1.0
  dtype: bfloat16
  drop_last: true
  image_augmentation: none
  prompt_augmentation: none
  dropout: 0.0

quantization:
  levels: 11
  center_dtype: float16
  initialization: deterministic_equal_width_bin_means
  assignment: nearest_center
  tie_break: lowest_center_index
  empty_bin_center: corresponding_left_bin_edge
  recompute_assignments_after_fp16_cast: true
  qat_enabled: false

description_length:
  symbol_code_upper_bound: ceil_d_times_empirical_entropy_plus_one
  codebook_bits_per_center: 16
  count_bits_per_symbol: ceil_log2_d_plus_one
  structure_choice_code: fixed_length_candidate_id
  structure_choice_bits: 2
  structure_choice_reason: ceil_log2_three_fixed_intrinsic_dimension_candidates
  prefix_length_code: elias_gamma_of_positive_raw_length
  prefix_length_formula: C_raw + 2*floor(log2(C_raw)) + 1

certificate:
  model_count: 3
  shared_sample_required: true
  reuse_v1_certificate_sample: false
  sample_generation_timing: after_all_three_v2_quantized_hypotheses_and_lengths_are_final
  sample_size: 10000
  sampling: uniform_with_replacement
  sampling_seed_policy: fresh_os_csprng
  delta_model: 0.025
  delta_subsample_family_total: 0.025
  per_model_subsample_correction: ln_model_count_over_delta_subsample
  alpha_search:
    family: reduced_dyadic
    max_denominator_bits: 16
    numerator: odd
    code_length: b + 2*floor(log2(b))

evaluation:
  canonical_prompt: "Describe this image."
  image_token_length: 64
  max_sequence_length: 450
  caption_policy: all_valid_assistant_captions
  weighting: equal_token_then_equal_caption_then_equal_cluster
  model_mode: eval
  smoothing_dtype: float64_log_domain
  old_v1_test_results_must_not_be_read_by_v2_training_or_model_selection_code: true

execution_order:
  - freeze_this_registry_and_implementation_contract
  - validate_S_1K_and_S_16K_projection_and_gradient_semantics
  - train_and_freeze_S_1K_and_S_16K_without_test_access
  - import_frozen_S_4K_v1_and_recompute_only_v2_description_cost
  - quantize_and_freeze_all_v2_hypotheses
  - draw_one_fresh_shared_certificate_sample
  - evaluate_all_three_models_with_model_count_three
  - produce_dimension_curve_without_using_old_test_for_selection

