schema_version: 1
registry_status: preregistered
registered_at: "2026-08-13T00:00:00+08:00"
experiment_id: minimind_v_bound_s4k_v1

upstream:
  minimind_v:
    repository: https://github.com/jingyaogong/minimind-v.git
    commit: 740d467ece78a0b7d2d976fcb424472095d4a688
  sublora_bounds:
    repository: https://github.com/Sanaelotfi/SubLoRA-bounds-for-LLMs.git
    commit: c606ea664e54fe60cfd870167bf6d1c1183fedf1

frozen_base:
  vision:
    provider: modelscope
    model_id: gongjy/siglip2-base-p32-256-ve
    local_path: model/siglip2-base-p32-256-ve
    eval_mode: true
    trainable: false
    image_size: 256
  language:
    provider: modelscope
    model_id: gongjy/minimind-3v-pytorch
    artifact: llm_768.pth
    local_path: model/llm_768.pth
    hidden_size: 768
    num_hidden_layers: 8
    use_moe: false
    trainable: false
  tokenizer:
    source: upstream/minimind-v/model
    local_path: upstream/minimind-v/model
  projector:
    architecture: layernorm-linear-gelu-linear
    input_dim: 768
    output_dim: 768
    parameter_count: 1182720
    initialization: pytorch_default
    initialization_seed: 20260813

data:
  provider: huggingface
  dataset_id: jingyaogong/minimind-v_dataset
  artifact: pretrain_i2t.parquet
  local_path: dataset/raw/pretrain_i2t.parquet
  prompt: "Describe this image."
  image_token_length: 64
  max_sequence_length: 450
  caption_policy: all_valid_assistant_captions
  cluster_weighting: equal_caption_then_equal_cluster
  image_normalization:
    exif_transpose: true
    color_mode: RGB
    resize_before_hash: false
    hash_payload: width_height_and_rgb_bytes
    hash_algorithm: sha256
  near_duplicate_detection:
    enabled: false
  split:
    unit: exact_image_cluster
    train_fraction: 0.9
    test_fraction: 0.1
    rng: numpy_pcg64
    seed: 20260814
    ordering_before_shuffle: ascending_cluster_sha256

model:
  configuration_id: S-4K
  parameterization: subspace
  intrinsic_dimension: 4096
  structured_projection:
    family: RDKronQR
    seed: 137
    implementation_contract: pinned_sublora_adapted_to_projector
  trainable_parameter_names:
    - subspace_params

training:
  seed: 20260815
  epochs: 2
  checkpoint_selection: final_epoch
  optimizer: AdamW
  learning_rate: 0.0004
  betas: [0.9, 0.999]
  epsilon: 1.0e-8
  weight_decay: 0.01
  scheduler: minimind_get_lr_pinned_commit
  per_gpu_batch_size: 16
  planned_world_size: 2
  global_batch_size: 32
  gradient_accumulation_steps: 1
  gradient_clip_norm: 1.0
  dtype: bfloat16
  image_augmentation: none
  prompt_augmentation: none
  dropout: 0.0

quantization:
  levels: 11
  center_dtype: float16
  initialization: deterministic_equal_width_bin_means
  assignment: nearest_center
  tie_break: lowest_center_index
  empty_bin_center: corresponding_left_bin_edge
  recompute_assignments_after_fp16_cast: true
  qat:
    enabled: false

description_length:
  symbol_code_upper_bound: ceil_d_times_empirical_entropy_plus_one
  codebook_bits_per_center: 16
  count_bits_per_symbol: ceil_log2_d_plus_one
  structure_choice_bits: 0
  structure_choice_reason: single_S-4K_configuration_fixed_as_side_information
  prefix_length_code: elias_gamma_of_positive_raw_length
  prefix_length_formula: C_raw + 2*floor(log2(C_raw)) + 1

certificate:
  sample_size: 10000
  sampling: uniform_with_replacement
  sampling_seed_policy: fresh_os_csprng_after_quantized_model_and_hash_are_final
  delta_model: 0.025
  delta_subsample: 0.025
  model_count: 1
  alpha_search:
    family: reduced_dyadic
    max_denominator_bits: 16
    numerator: odd
    code_length: b + 2*floor(log2(b))

test:
  eta: 0.05
  unlock_condition: quantized_model_hash_K_alpha_and_certificate_are_final
  simultaneous_model_count: 1
