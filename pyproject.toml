[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "minimind-v-bound"
version = "0.1.0"
description = "Compression-bound experiments for a frozen-base MiniMind-V projector"
requires-python = ">=3.11,<3.12"

[tool.setuptools.packages.find]
include = ["minimind_v_bound*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
